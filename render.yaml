services:
  - type: web
    name: auth-service
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: AUTH_DB_URL
        sync: false
      - key: AUTH_DB_USERNAME
        sync: false
      - key: AUTH_DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_AUDIENCE
        value: tasksphere-app
      - key: AUTH_CLIENT_ID
        value: tasksphere-app
      - key: AUTH_CLIENT_SECRET
        generateValue: true
      - key: AUTH_ADMIN_API_KEY
        generateValue: true
