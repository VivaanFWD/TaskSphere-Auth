spring:
  datasource:
    url: ${AUTH_DB_URL}
    username: ${AUTH_DB_USERNAME}
    password: ${AUTH_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT}
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          starttls:
            enable: ${SMTP_STARTTLS:true}

security:
  jwt:
    secret: ${JWT_SECRET}
    audience: ${JWT_AUDIENCE}
  admin:
    api-key: ${AUTH_ADMIN_API_KEY}
  client:
    id: ${AUTH_CLIENT_ID}
    secret: ${AUTH_CLIENT_SECRET}

app:
  mail-from: ${SMTP_FROM}

server:
  port: ${PORT:${AUTH_SERVER_PORT:8081}}

management:
  health:
    mail:
      enabled: ${SMTP_HEALTH_ENABLED:true}
