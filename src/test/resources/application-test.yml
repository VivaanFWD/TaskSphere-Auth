spring:
  datasource:
    url: jdbc:h2:mem:authdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
security:
  jwt:
    issuer: tasksphere-auth
    audience: tasksphere-app
    secret: very-secret-key-very-secret-key-1234567890
    expiration-minutes: 60
  client:
    id: tasksphere-app
    secret: local-only-client-secret-change-before-deploying
  admin:
    api-key: test-admin-key
